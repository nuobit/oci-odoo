[options]
; Non-secret per-instance Odoo runtime configuration.
;
; This file belongs to the deployment repository, not to the OCI image
; repository. In a real deployment repo, copy it to:
;
;   instances/<instance>/odoo.conf
;
; Never put these options here:
;
;   addons_path     -> generated by the image at /etc/odoo/addons_path
;   db_password     -> mounted from a Kubernetes Secret file
;   admin_passwd    -> Odoo master password, mounted from a Kubernetes Secret file
;
; odoo-run merges this file with image/Secret values into:
;
;   /run/odoo/odoo-runtime.conf

; PostgreSQL connection, without password.
db_host = <postgres-service>
db_user = <postgres-role>
db_name = <database-name>
; PostgreSQL default. Uncomment only if the deployment should pin it explicitly.
; db_port = 5432
; Optional when one deployment should restrict visible databases by pattern.
; dbfilter = ^<database-name>$

; Persistent filestore/data directory mounted from the instance PVC.
data_dir = /var/lib/odoo

; Platform-safe runtime behavior.
proxy_mode = True
list_db = False

; Odoo defaults. Uncomment only if the deployment should pin them explicitly.
; http_port = 8069
; gevent_port = 8072

; Production tuning. Decide per instance according to CPU, RAM, cron pressure,
; workload, and Kubernetes resource limits. Keep these values aligned with the
; Kubernetes Pod resources; Odoo memory limits are per Odoo process/worker, not
; the total Pod memory limit.
;
; workers:
;   Number of HTTP worker processes. 0 means non-prefork/threaded mode, useful
;   only for very small/dev-style deployments. A common production starting
;   point is roughly (CPU cores * 2) + 1, then adjust with real load.
; workers = 2
;
; max_cron_threads:
;   Number of cron workers/threads. Start low unless the instance has heavy
;   scheduled jobs or queue-style workloads. 1 is a conservative baseline.
; max_cron_threads = 1
;
; limit_time_cpu:
;   CPU time limit per request/job, in seconds. 600 = 10 minutes of CPU time.
; limit_time_cpu = 600
;
; limit_time_real:
;   Wall-clock time limit per request/job, in seconds. 1200 = 20 minutes real
;   elapsed time, including waiting on I/O, database, or external services.
; limit_time_real = 1200
;
; limit_memory_soft:
;   Soft virtual memory limit per Odoo worker process, in bytes. When exceeded,
;   Odoo schedules the worker for recycling after the current request. The value
;   below is 2,147,483,648 bytes = 2 GiB.
; limit_memory_soft = 2147483648
;
; limit_memory_hard:
;   Hard virtual memory limit per Odoo worker process, in bytes. When exceeded,
;   the worker can be killed. The value below is 2,684,354,560 bytes = 2.5 GiB.
;   The Kubernetes Pod memory limit must leave enough room for all Odoo
;   processes plus overhead, not just this single-worker value.
; limit_memory_hard = 2684354560

; If queue_job is installed and used:
; server_wide_modules = web,queue_job
;
; [queue_job]
; channels = root:2
